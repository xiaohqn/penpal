<svg xmlns="http://www.w3.org/2000/svg" width="360" height="80" viewBox="0 0 360 80" role="img" aria-labelledby="title desc">
  <title id="title">SCIR 心灵笔友实验室标志</title>
  <desc id="desc">A soft lilac letter and heart-chat wordmark for SCIR.</desc>
  <defs>
    <linearGradient id="mark" x1="10" y1="8" x2="76" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7E7DC"/>
      <stop offset=".48" stop-color="#B79CF7"/>
      <stop offset="1" stop-color="#FFC6DD"/>
    </linearGradient>
    <linearGradient id="text" x1="92" y1="17" x2="318" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6652C9"/>
      <stop offset=".58" stop-color="#9A7BE8"/>
      <stop offset="1" stop-color="#CB6FAE"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#6C53AB" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="360" height="80" rx="24" fill="#FFFFFF" fill-opacity=".7"/>
  <g filter="url(#softShadow)">
    <rect x="14" y="15" width="56" height="48" rx="18" fill="url(#mark)"/>
    <path d="M23 28.5 42 43l19-14.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <path d="M25 51 39 39.8M59 51 45 39.8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".48"/>
    <path d="M56.4 20.8c9.3 0 16.8 6.7 16.8 15 0 5.6-3.4 10.4-8.5 13l.6 7.1-7.8-4.8h-1.1c-9.3 0-16.8-6.7-16.8-15s7.5-15.3 16.8-15.3Z" fill="#fff" fill-opacity=".92"/>
    <path d="M56.5 32.6c1.1-2 3.7-2.3 5.1-.7 1.5 1.7 1.2 4.3-.6 5.9l-4.5 3.9-4.5-3.9c-1.8-1.6-2.1-4.2-.6-5.9 1.4-1.6 4-.1 5.1.7Z" fill="#9A7BE8"/>
  </g>
  <text x="92" y="37" fill="url(#text)" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="1.2">SCIR</text>
